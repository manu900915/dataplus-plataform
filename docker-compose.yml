version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataplus-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - dataplus-network
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: dataplus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataplus
      POSTGRES_USER: dataplus
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dataplus-network

  redis:
    image: redis:7-alpine
    container_name: dataplus-redis
    restart: unless-stopped
    networks:
      - dataplus-network

  nginx:
    image: nginx:alpine
    container_name: dataplus-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dataplus-network
    depends_on:
      - app

  mailpit:
    image: axllent/mailpit:latest
    container_name: dataplus-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - dataplus-network

volumes:
  pgdata:

networks:
  dataplus-network:
    driver: bridge
