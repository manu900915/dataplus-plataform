name: CI/CD Pipeline - DataPlus Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. Continuous Integration (Compilación y Verificación)
  # ============================================================
  build:
    name: Build & Validate React/Vite App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Frontend
        run: |
          npm install
          npm run build

  # ============================================================
  # 2. Despliegue directo en tu VPS con Self-Hosted Runner
  # ============================================================
  deploy:
    name: Deploy directly on VPS
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted

    steps:
      - name: Run Deploy Script on VPS
        run: |
          echo "🚀 Ejecutando despliegue local en VPS..."
          # Ir a la carpeta donde tienes el proyecto clonado en el VPS:
          cd "${{ secrets.SERVER_PATH || '/opt/dataplus-platform' }}"
          
          if [ ! -f "deploy.sh" ]; then
            echo "❌ Error: deploy.sh no encontrado en $(pwd)"
            exit 1
          fi
          
          chmod +x deploy.sh
          ./deploy.sh
          
          echo "✅ Despliegue completado con éxito."
