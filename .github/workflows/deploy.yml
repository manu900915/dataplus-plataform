name: CI/CD Pipeline - DataPlus Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. Continuous Integration (Compilación y Build de Vite)
  # ============================================================
  build:
    name: Build & Validate React/Vite App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Frontend
        run: |
          npm install
          npm run build

  # ============================================================
  # 2. Continuous Deployment to Production VPS
  # ============================================================
  deploy:
    name: Deploy to Production VPS (srv3.dataplus.cu)
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            echo "🚀 Iniciando despliegue automatizado en VPS..."
            cd ${{ secrets.SERVER_PATH || '/opt/dataplus-platform' }}
            
            # Verificar existencia del script de despliegue
            if [ ! -f "deploy.sh" ]; then
              echo "❌ Error: deploy.sh no encontrado en el directorio del proyecto."
              exit 1
            fi
            
            chmod +x deploy.sh
            ./deploy.sh
            
            echo "✅ Despliegue completado con éxito."
