name: CI/CD Pipeline - DataPlus Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, redis
          coverage: none

      - name: Install Composer Dependencies
        working-directory: ./src
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies & Build Assets
        working-directory: ./src
        run: |
          npm ci || npm install
          npm run build

  deploy:
    name: Deploy to Production VPS (srv3.dataplus.cu)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            echo "🚀 Iniciando despliegue automatizado en VPS..."
            cd ${{ secrets.SERVER_PATH || '/opt/dataplus-platform' }}
            
            if [ ! -f "deploy.sh" ]; then
              echo "❌ Error: deploy.sh no encontrado en el directorio del proyecto."
              exit 1
            fi
            
            chmod +x deploy.sh
            ./deploy.sh
            
            echo "✅ Despliegue completado con éxito."
