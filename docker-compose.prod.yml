# ============================================================
# DOCKER COMPOSE - PRODUCCIÓN (VPS)
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Nombres con prefijo "dp-prod-" para NO chocar con otros contenedores.
# Las credenciales se leen de .env (POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD).
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp-prod-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      # El contenedor db se llama dp-prod-db, no "db"
      DB_HOST: dp-prod-db
      REDIS_HOST: dp-prod-redis
      LDAP_HOST: dp-prod-lldap
      MAIL_HOST: dp-prod-mailpit
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - dp-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: dp-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - dp-prod-pgdata:/var/lib/postgresql/data
    # Puerto NO expuesto al host (solo red interna dp-prod-network)
    networks:
      - dp-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: dp-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - dp-prod-redisdata:/data
    networks:
      - dp-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  lldap:
    image: nitnelave/lldap:stable
    container_name: dp-prod-lldap
    restart: unless-stopped
    ports:
      - "${LLDAP_LDAP_PORT:-3891}:3890"     # LDAP (desplazado para no chocar)
      - "${LLDAP_HTTP_PORT:-17171}:17170"   # Web UI
    environment:
      LLDAP_LDAP_DOMAIN: "${LLDAP_LDAP_DOMAIN:-dataplus.cu}"
      LLDAP_LDAP_BASE_DN: "${LLDAP_BASE_DN:-dc=dataplus,dc=cu}"
      LLDAP_LDAP_USER_DN: "${LLDAP_ADMIN_USER:-admin}"
      LLDAP_LDAP_USER_PASS: "${LLDAP_ADMIN_PASS:?Define LLDAP_ADMIN_PASS en .env}"
      LLDAP_JWT_SECRET: "${LLDAP_JWT_SECRET:?Define LLDAP_JWT_SECRET en .env}"
      LLDAP_LDAP_OPTIONS__ENCRYPTION_REQUIRED: "false"
      LLDAP_HTTP_URL: "${LLDAP_PUBLIC_URL:-http://localhost:17171}"
    volumes:
      - dp-prod-lldap_data:/data
    networks:
      - dp-prod-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:17170/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: dp-prod-nginx
    restart: unless-stopped
    volumes:
      - ./src:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dp-prod-network
      - proxy_net
    depends_on:
      - app

  mailpit:
    image: axllent/mailpit:latest
    container_name: dp-prod-mailpit
    restart: unless-stopped
    networks:
      - dp-prod-network

volumes:
  dp-prod-pgdata:
  dp-prod-redisdata:
  dp-prod-lldap_data:

networks:
  dp-prod-network:
    driver: bridge
  proxy_net:
    external: true
