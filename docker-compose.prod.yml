# ============================================================
# DOCKER COMPOSE - PRODUCCIÓN (VPS)
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Nombres con prefijo "dp-prod-" para NO chocar con otros contenedores.
# Las credenciales se leen de .env (POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD).
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp-prod-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      # El contenedor db se llama dp-prod-db, no "db"
      DB_HOST: dp-prod-db
      REDIS_HOST: dp-prod-redis
      MAIL_HOST: dp-prod-mailpit
      # LDAP_HOST y LDAP_PORT se leen de .env (apuntan al LLDAP YA existente en el VPS)
    extra_hosts:
      # Permite usar host.docker.internal para llegar a servicios del host
      # (p.ej. tu lldap corriendo fuera de este compose)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - dp-prod-network
      - proxy_net   # para alcanzar el lldap/proxy que ya corre en esa red
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: registry.docker.ir/postgres:16-alpine
    container_name: dp-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - dp-prod-pgdata:/var/lib/postgresql/data
    # Puerto NO expuesto al host (solo red interna dp-prod-network)
    networks:
      - dp-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: registry.docker.ir/redis:7-alpine
    container_name: dp-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - dp-prod-redisdata:/data
    networks:
      - dp-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: registry.docker.ir/nginx:alpine
    container_name: dp-prod-nginx
    restart: unless-stopped
    volumes:
      - ./src:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dp-prod-network
      - proxy_net
    depends_on:
      - app

  mailpit:
    image: registry.docker.ir/axllent/mailpit:latest
    container_name: dp-prod-mailpit
    restart: unless-stopped
    networks:
      - dp-prod-network

volumes:
  dp-prod-pgdata:
  dp-prod-redisdata:

networks:
  dp-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
  proxy_net:
    external: true
